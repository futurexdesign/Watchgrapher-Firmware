<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Timegrapher HID smoke</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; margin: 1.5rem; max-width: 52rem; }
    button { margin: 0.25rem 0.25rem 0.25rem 0; padding: 0.4rem 0.7rem; }
    pre { background: #111; color: #ddd; padding: 0.75rem; overflow: auto; min-height: 12rem; }
    .row { margin: 0.75rem 0; }
  </style>
</head>
<body>
  <h1>Timegrapher WebHID</h1>
  <p>Usage Page <code>0xFFA0</code> / Usage <code>0x0001</code>. Serve via localhost or HTTPS.</p>
  <div class="row">
    <button id="connect">Connect</button>
    <button id="hello" disabled>hello</button>
    <button id="state" disabled>getState</button>
    <button id="patch" disabled>patch +6 dB / notch 60</button>
    <button id="sub" disabled>subscribe</button>
  </div>
  <pre id="log"></pre>
  <script>
const USAGE_PAGE = 0xffa0, USAGE = 0x0001, REPORT_ID = 0x01;
const FLAG_MORE = 0x01, MAX_CHUNK = 58, MAX_JSON = 2048;
const logEl = document.getElementById('log');
function log(...a) { logEl.textContent += a.map(String).join(' ') + '\n'; logEl.scrollTop = logEl.scrollHeight; }

class HidFramer {
  constructor() { this._txSeq = 0; this._rx = null; this.onMessage = null; }
  encode(obj) {
    const text = new TextEncoder().encode(JSON.stringify(obj));
    if (text.length > MAX_JSON) throw new Error('json too large');
    const fragCount = Math.max(1, Math.ceil(text.length / MAX_CHUNK));
    const seq = (this._txSeq++) & 0xff;
    const reports = [];
    for (let i = 0; i < fragCount; i++) {
      const chunk = text.subarray(i * MAX_CHUNK, i * MAX_CHUNK + MAX_CHUNK);
      const buf = new Uint8Array(5 + chunk.length);
      buf[0] = i + 1 < fragCount ? FLAG_MORE : 0;
      buf[1] = seq; buf[2] = i; buf[3] = fragCount; buf[4] = chunk.length;
      buf.set(chunk, 5);
      reports.push(buf);
    }
    return reports;
  }
  push(data) {
    const u8 = data instanceof Uint8Array ? data : new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
    if (u8.length < 5) return;
    const seq = u8[1], fragIndex = u8[2], fragCount = u8[3], payloadLen = u8[4];
    const chunk = u8.subarray(5, 5 + payloadLen);
    if (!this._rx || this._rx.seq !== seq) this._rx = { seq, parts: Array(fragCount), got: 0, count: fragCount };
    if (fragIndex >= this._rx.count || this._rx.parts[fragIndex]) return;
    this._rx.parts[fragIndex] = chunk; this._rx.got++;
    if (this._rx.got !== this._rx.count) return;
    let total = 0; for (const p of this._rx.parts) total += p.byteLength;
    const out = new Uint8Array(total); let o = 0;
    for (const p of this._rx.parts) { out.set(p, o); o += p.byteLength; }
    this._rx = null;
    const obj = JSON.parse(new TextDecoder().decode(out));
    if (this.onMessage) this.onMessage(obj);
  }
}

class Client {
  constructor(device) {
    this.device = device; this.framer = new HidFramer(); this._pending = new Map(); this._nextId = 1;
    this.onNotify = null;
    this.framer.onMessage = (msg) => {
      if (msg.notify) { if (this.onNotify) this.onNotify(msg); return; }
      const p = this._pending.get(msg.id); if (!p) return;
      this._pending.delete(msg.id);
      if (msg.ok) p.resolve(msg.result); else p.reject(msg.error || msg);
    };
    device.addEventListener('inputreport', (ev) => {
      if (ev.reportId !== REPORT_ID) return;
      this.framer.push(ev.data);
    });
  }
  async request(op, extra = {}) {
    const id = this._nextId++;
    const body = { v: 1, id, op, ...extra };
    const result = new Promise((resolve, reject) => {
      this._pending.set(id, { resolve, reject });
      setTimeout(() => { if (this._pending.has(id)) { this._pending.delete(id); reject(new Error('timeout')); } }, 3000);
    });
    for (const r of this.framer.encode(body)) await this.device.sendReport(REPORT_ID, r);
    return result;
  }
}

let client = null;
function setEnabled(on) {
  for (const id of ['hello', 'state', 'patch', 'sub']) document.getElementById(id).disabled = !on;
}

document.getElementById('connect').onclick = async () => {
  try {
    const devices = await navigator.hid.requestDevice({ filters: [{ usagePage: USAGE_PAGE, usage: USAGE }] });
    const device = devices[0];
    if (!device) return;
    if (!device.opened) await device.open();
    client = new Client(device);
    client.onNotify = (m) => log('NOTIFY', m.op, JSON.stringify(m.data));
    setEnabled(true);
    log('connected', device.productName || '(no product string)');
  } catch (e) { log('connect error', e); }
};

document.getElementById('hello').onclick = async () => {
  try { log('hello', JSON.stringify(await client.request('hello'), null, 2)); }
  catch (e) { log('err', e); }
};
document.getElementById('state').onclick = async () => {
  try { log('state', JSON.stringify(await client.request('getState'), null, 2)); }
  catch (e) { log('err', e); }
};
document.getElementById('patch').onclick = async () => {
  try {
    const r = await client.request('patchState', {
      patch: { bypass: false, blocks: {
        gain: { enabled: true, params: { db: 6 } },
        notch: { enabled: true, params: { hz: 60 } },
      } },
    });
    log('patched', JSON.stringify(r.blocks?.gain), JSON.stringify(r.blocks?.notch));
  } catch (e) { log('err', e); }
};
document.getElementById('sub').onclick = async () => {
  try {
    log('sub', JSON.stringify(await client.request('subscribe', {
      metricsHz: 5, beatHz: 1, events: true, errors: true,
    })));
  } catch (e) { log('err', e); }
};
  </script>
</body>
</html>
