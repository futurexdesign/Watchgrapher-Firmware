	-D_RP2350=1
	-DBOARD_PICO2=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0

[env:kiwi]
platform = ${common.platform}
framework = ${common.framework}
board = generic_rp2350
board_build.core = ${common.board_build.core}
board_build.flash_size = 2MB
board_upload.maximum_size = 2097152
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
upload_protocol = picoprobe
debug_tool = picoprobe
build_flags =
	${common.build_flags}
	-DAUDIO_SOURCE=ADC
	-D_RP2350=1
	-D__PICO_RP2350A=0
	-DBOARD_KIWI=1
	-DADC_GPIO=40
	-DADC_CHANNEL=0

