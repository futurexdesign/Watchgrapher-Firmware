; Timegrapher Stand — USB mono microphone (UAC2) firmware
; PlatformIO + Arduino-Pico (earlephilhower) via maxgerhardt platform.
;
; Layout: [base] holds everything shared; [board_pico2] / [board_kiwi] add the
; board (incl. OLED pins); each [env:*] picks a board section and adds the
; audio source + pins. Build without the display: -DDISPLAY_SH1107=0.

[base]
; Pinned: the platform pins framework-arduinopico by commit, so an unpinned
; platform pulls whatever arduino-pico is newest. This commit = arduino-pico
; 5.5.1 (275e73d). 6.x renames the TinyUSB UAC2 API (AUDIO_* -> AUDIO20_*)
; and breaks usb_audio.cpp / usb_descriptors.cpp.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473e1a8010ed8096388690222fd2c94858a6
framework = arduino
board_build.core = earlephilhower
lib_archive = no
; Evaluate #if when resolving library includes: ble_control.cpp includes
; <BLE.h> only under TG_BLE, and the default finder would build the BLE
; library (which static_asserts without Bluetooth) in every env.
lib_ldf_mode = chain+
; -DTG_SYNTH_CLIP=<id> (synthetic builds) loops a recorded clip from
; assets/synth_clips/; the script generates its table (assets/synth_clips/README.md).
extra_scripts = pre:scripts/synth_clip_header.py
monitor_speed = 115200
; CMSIS-DSP is vendored in third_party/CMSIS-DSP and compiled from source with
; the framework's own float ABI flags (Arduino-Pico RP2350 = softfp +
; fpv5-sp-d16; do NOT force hard, it will not link with the prebuilt framework
; libs). See third_party/CMSIS-DSP/README.md.
lib_extra_dirs = third_party
lib_deps =
	CMSIS-DSP
	; SH1107 128x128 OLED on core 1 (display_ui.cpp). Pinned for reproducible builds.
	adafruit/Adafruit SH110X@2.1.15
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit BusIO@1.17.4
; TinyUSB audio-only: override Adafruit defaults via -D (CFG_TUSB_CONFIG_FILE
; quoting is unreliable under PlatformIO; project include/ is not first for libs).
; These flags are the only TinyUSB configuration — there is no tusb_config.h.
build_flags =
	-Os
	-DUSE_TINYUSB
	-DCFG_TUD_AUDIO=1
	-DCFG_TUD_CDC=1
	-DCFG_TUD_MSC=0
	-DCFG_TUD_HID=1
	-DCFG_TUD_MIDI=0
	-DCFG_TUD_VENDOR=0
	-DCFG_TUD_VIDEO=0
	-DCFG_TUD_VIDEO_STREAMING=0
	-DCFG_TUD_AUDIO_ENABLE_EP_IN=1
	-DCFG_TUD_AUDIO_ENABLE_EP_OUT=0
	-DCFG_TUD_AUDIO_ENABLE_FEEDBACK_EP=0
	-DCFG_TUD_AUDIO_EP_IN_FLOW_CONTROL=1
	-DCFG_TUD_AUDIO_FUNC_1_SAMPLE_RATE=48000
	-DCFG_TUD_AUDIO_FUNC_1_N_BYTES_PER_SAMPLE_TX=3
	-DCFG_TUD_AUDIO_FUNC_1_N_CHANNELS_TX=1
	-DCFG_TUD_AUDIO_FUNC_1_N_AS_INT=1
	-DCFG_TUD_AUDIO_FUNC_1_CTRL_BUF_SZ=64
	; Max ISO packet = 49 samples × 3 bytes (47/48/49 flow control).
	-DCFG_TUD_AUDIO_EP_SZ_IN=147
	-DCFG_TUD_AUDIO_FUNC_1_EP_IN_SZ_MAX=147
	; IN FIFO of 16 max packets. Flow control keeps it about half full, so the
	; main loop may stall ~8 ms without the host seeing an empty ISO packet
	; (with 4 packets, ~2 ms: BLE load on a Pico 2 W broke the stream, 2026-11-23).
	-DCFG_TUD_AUDIO_FUNC_1_EP_IN_SW_BUF_SZ=2352
	; Must equal TUD_AUDIO_MIC_ONE_CH_DESC_LEN (static_assert in usb_descriptors.cpp).
	-DCFG_TUD_AUDIO_FUNC_1_DESC_LEN=132
	-DARM_MATH_CM33
	-D_RP2350=1
	; 128x128 SH1107 I2C OLED readout on core 1 (pins per board below).
	-DDISPLAY_SH1107=1
	-DSH110X_NO_SPLASH
; CLI sources are not compiled unless an env opts in via [cli] (plan §5.7).
; An env that sets build_src_filter REPLACES this value (it does not append),
; so every *_cli env takes ${cli.build_src_filter}.
build_src_filter = +<*> -<cli/> -<serial_cli.cpp>

; Raspberry Pi Pico 2 (RP2350A): ADC on GPIO26.
[board_pico2]
extends = base
board = rpipico2
build_flags =
	${base.build_flags}
	-DBOARD_PICO2=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0
	-DDISPLAY_SDA_GPIO=4
	-DDISPLAY_SCL_GPIO=5

; KiwiBoard / RP2354 (RP2350B, 2 MB flash): ADC on GPIO40, picoprobe upload.
[board_kiwi]
extends = base
board = generic_rp2350
board_build.flash_size = 2MB
board_upload.maximum_size = 2097152
upload_protocol = picoprobe
debug_tool = picoprobe
build_flags =
	${base.build_flags}
	-D__PICO_RP2350A=0
	-DBOARD_KIWI=1
	-DADC_GPIO=40
	-DADC_CHANNEL=0
	; GP4 is PCM1808 DOUT on Kiwi, so the display uses I2C1 on GP6/GP7.
	-DDISPLAY_SDA_GPIO=6
	-DDISPLAY_SCL_GPIO=7

; BLE control plane (Pico 2 W only). See docs/BLE_CONTROL_PLANE.md. The radio
; runs on core 1 next to the display (plan section 5.8, decided by HW-19,
; 2026-11-23): -DTG_BLE_CORE=1 here and the project variant in [board_pico2w].
; Core 0 stays an override: docs/build_and_flash.md, "Radio core".
[ble]
build_flags =
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
	-DTG_BLE=1
	-DTG_BLE_CORE=1

; Raspberry Pi Pico 2 W (RP2350A + CYW43439). Radio owns GPIO23/24/25/29:
; the status LED is the CYW43 LED, never GPIO25 (board_config.h).
; The project variant copies rpipico2w with initVariant() starting the CYW43
; only when TG_BLE_CORE is not 1 (variants/rpipico2w_tg/init.cpp); with
; -DTG_BLE_CORE=1 the radio starts from core 1 (src/ble_core.cpp). Envs
; without [ble] build the same code as the stock variant.
[board_pico2w]
extends = board_pico2
board = rpipico2w
board_build.variants_dir = variants
board_build.variant = rpipico2w_tg
build_flags =
	${board_pico2.build_flags}
	-DBOARD_PICO2W=1
	-DPPS_GPIO=3
	-DGPS_UART_RX=7

; Legacy serial (CDC) CLI. Omitted by default: USB HID and BLE are the control
; planes. Add ${cli.build_flags} to build_flags and set
; build_src_filter = ${cli.build_src_filter} in the env to bring it back (the
; env's filter replaces [base]'s, so the re-include must be repeated there).
; The CDC interface itself is in every build (upload auto-reset, plan F-18).
[cli]
build_flags = -DTG_SERIAL_CLI=1
build_src_filter = +<*> +<cli/> +<serial_cli.cpp>

[env:pico2]
extends = board_pico2
build_flags =
	${board_pico2.build_flags}
	-DAUDIO_SOURCE=ADC

[env:pico2_synthetic]
extends = board_pico2
build_flags =
	${board_pico2.build_flags}
	-DAUDIO_SOURCE=SYNTHETIC

[env:pico2_pcm1808]
extends = board_pico2
build_flags =
	${board_pico2.build_flags}
	-DAUDIO_SOURCE=PCM1808
	-DPCM1808_MCLK_GPIO=21
	-DPCM1808_BCK_GPIO=18
	-DPCM1808_LRCK_GPIO=20
	-DPCM1808_DOUT_GPIO=19
	-DPPS_GPIO=3

[env:pico2w]
extends = board_pico2w
build_flags =
	${board_pico2w.build_flags}
	${ble.build_flags}
	-DAUDIO_SOURCE=ADC

[env:pico2w_synthetic]
extends = board_pico2w
build_flags =
	${board_pico2w.build_flags}
	${ble.build_flags}
	-DAUDIO_SOURCE=SYNTHETIC
	-DPPS_GPIO=3
	-DGPS_UART_RX=7

[env:pico2w_pcm1808]
extends = board_pico2w
build_flags =
	${board_pico2w.build_flags}
	${ble.build_flags}
	-DAUDIO_SOURCE=PCM1808
	-DPCM1808_MCLK_GPIO=21
	-DPCM1808_BCK_GPIO=18
	-DPCM1808_LRCK_GPIO=20
	-DPCM1808_DOUT_GPIO=19
	-DPPS_GPIO=3

; W board, BLE NOT built. Isolation build for hardware gate G0 (HW-01, HW-02).
; Includes the CLI so `diag` is reachable over CDC. Not in CI.
[env:pico2w_synthetic_noble]
extends = board_pico2w
build_flags =
	${board_pico2w.build_flags}
	${cli.build_flags}
	-DAUDIO_SOURCE=SYNTHETIC
build_src_filter = ${cli.build_src_filter}

[env:kiwi]
extends = board_kiwi
build_flags =
	${board_kiwi.build_flags}
	-DAUDIO_SOURCE=ADC

[env:kiwi_synthetic]
extends = board_kiwi
build_flags =
	${board_kiwi.build_flags}
	-DAUDIO_SOURCE=SYNTHETIC

[env:kiwi_pcm1808]
extends = board_kiwi
build_flags =
	${board_kiwi.build_flags}
	-DAUDIO_SOURCE=PCM1808
	-DPCM1808_MCLK_GPIO=21
	-DPCM1808_BCK_GPIO=2
	-DPCM1808_LRCK_GPIO=3
	-DPCM1808_DOUT_GPIO=4

; CI keeps the CLI compiling (CLI-01 / A8 regression). Not in CI: the W envs below.
[env:pico2_pcm1808_cli]
extends = board_pico2
build_flags =
	${board_pico2.build_flags}
	${cli.build_flags}
	-DAUDIO_SOURCE=PCM1808
	-DPCM1808_MCLK_GPIO=21
	-DPCM1808_BCK_GPIO=18
	-DPCM1808_LRCK_GPIO=20
	-DPCM1808_DOUT_GPIO=19
	-DPPS_GPIO=3
build_src_filter = ${cli.build_src_filter}

; W + BLE + CLI, hardware day (not in CI).
[env:pico2w_pcm1808_cli]
extends = board_pico2w
build_flags =
	${board_pico2w.build_flags}
	${ble.build_flags}
	${cli.build_flags}
	-DAUDIO_SOURCE=PCM1808
	-DPCM1808_MCLK_GPIO=21
	-DPCM1808_BCK_GPIO=18
	-DPCM1808_LRCK_GPIO=20
	-DPCM1808_DOUT_GPIO=19
	-DPPS_GPIO=3
build_src_filter = ${cli.build_src_filter}

; W + BLE + CLI + synthetic source: HW-02/HW-06 A/B and the G1 echo build (not in CI).
[env:pico2w_synthetic_cli]
extends = board_pico2w
build_flags =
	${board_pico2w.build_flags}
	${ble.build_flags}
	${cli.build_flags}
	-DAUDIO_SOURCE=SYNTHETIC
build_src_filter = ${cli.build_src_filter}
