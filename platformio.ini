; Timegrapher Stand — USB mono microphone (UAC2) firmware
; PlatformIO + Arduino-Pico (earlephilhower) via maxgerhardt platform.

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
lib_archive = no
monitor_speed = 115200
; TinyUSB audio-only: override Adafruit defaults via -D (CFG_TUSB_CONFIG_FILE
; quoting is unreliable under PlatformIO; project include/ is not first for libs).
build_flags =
	-Os
	-DUSE_TINYUSB
	-DCFG_TUD_AUDIO=1
	-DCFG_TUD_CDC=1
	-DCFG_TUD_MSC=0
	-DCFG_TUD_HID=0
	-DCFG_TUD_MIDI=0
	-DCFG_TUD_VENDOR=0
	-DCFG_TUD_VIDEO=0
	-DCFG_TUD_VIDEO_STREAMING=0
	-DCFG_TUD_AUDIO_ENABLE_EP_IN=1
	-DCFG_TUD_AUDIO_ENABLE_EP_OUT=0
	-DCFG_TUD_AUDIO_ENABLE_FEEDBACK_EP=0
	-DCFG_TUD_AUDIO_EP_IN_FLOW_CONTROL=1
	-DCFG_TUD_AUDIO_FUNC_1_SAMPLE_RATE=48000
	-DCFG_TUD_AUDIO_FUNC_1_N_BYTES_PER_SAMPLE_TX=2
	-DCFG_TUD_AUDIO_FUNC_1_N_CHANNELS_TX=1
	-DCFG_TUD_AUDIO_FUNC_1_N_AS_INT=1
	-DCFG_TUD_AUDIO_FUNC_1_CTRL_BUF_SZ=64
	-DCFG_TUD_AUDIO_EP_SZ_IN=98
	-DCFG_TUD_AUDIO_FUNC_1_EP_IN_SZ_MAX=98
	-DCFG_TUD_AUDIO_FUNC_1_EP_IN_SW_BUF_SZ=392
	-DCFG_TUD_AUDIO_FUNC_1_DESC_LEN=132

[env:pico]
platform = ${common.platform}
framework = ${common.framework}
board = rpipico
board_build.core = ${common.board_build.core}
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
build_flags =
	${common.build_flags}
	-DAUDIO_SOURCE=ADC
	-DBOARD_PICO=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0

[env:pico_synthetic]
platform = ${common.platform}
framework = ${common.framework}
board = rpipico
board_build.core = ${common.board_build.core}
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
build_flags =
	${common.build_flags}
	-DAUDIO_SOURCE=SYNTHETIC
	-DBOARD_PICO=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0

[env:pico_pcm1808]
platform = ${common.platform}
framework = ${common.framework}
board = rpipico
board_build.core = ${common.board_build.core}
; Match RP2350 PCM1808 MCLK math: PLL_SYS / clk_sys at 150 MHz (default Pico is 133).
board_build.f_cpu = 150000000L
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
build_flags =
	${common.build_flags}
	-DAUDIO_SOURCE=PCM1808
	-DBOARD_PICO=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0
	-DPCM1808_MCLK_GPIO=21
	-DPCM1808_BCK_GPIO=2
	-DPCM1808_LRCK_GPIO=3
	-DPCM1808_DOUT_GPIO=4

[env:pico2]
platform = ${common.platform}
framework = ${common.framework}
board = rpipico2
board_build.core = ${common.board_build.core}
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
build_flags =
	${common.build_flags}
	-DAUDIO_SOURCE=ADC
	-D_RP2350=1
	-DBOARD_PICO2=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0

[env:pico2_synthetic]
platform = ${common.platform}
framework = ${common.framework}
