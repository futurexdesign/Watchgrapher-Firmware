	${rp2350_dsp.build_flags}
	-DAUDIO_SOURCE=PCM1808
	-D_RP2350=1
	-DBOARD_PICO2=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0
	-DPCM1808_MCLK_GPIO=21
	-DPCM1808_BCK_GPIO=2
	-DPCM1808_LRCK_GPIO=3
	-DPCM1808_DOUT_GPIO=4

