; Timegrapher Stand — USB mono microphone (UAC2) firmware
; PlatformIO + Arduino-Pico (earlephilhower) via maxgerhardt platform.

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
lib_archive = no
monitor_speed = 115200
; TinyUSB audio-only: override Adafruit defaults via -D (CFG_TUSB_CONFIG_FILE
; quoting is unreliable under PlatformIO; project include/ is not first for libs).
build_flags =
	-Os
	-DUSE_TINYUSB
	-DCFG_TUD_AUDIO=1
	-DCFG_TUD_CDC=1
	-DCFG_TUD_MSC=0
	-DCFG_TUD_HID=1
	-DCFG_TUD_MIDI=0
	-DCFG_TUD_VENDOR=0
	-DCFG_TUD_VIDEO=0
	-DCFG_TUD_VIDEO_STREAMING=0
	-DCFG_TUD_AUDIO_ENABLE_EP_IN=1
	-DCFG_TUD_AUDIO_ENABLE_EP_OUT=0
	-DCFG_TUD_AUDIO_ENABLE_FEEDBACK_EP=0
	-DCFG_TUD_AUDIO_EP_IN_FLOW_CONTROL=1
	-DCFG_TUD_AUDIO_FUNC_1_SAMPLE_RATE=48000
	-DCFG_TUD_AUDIO_FUNC_1_N_BYTES_PER_SAMPLE_TX=3
	-DCFG_TUD_AUDIO_FUNC_1_N_CHANNELS_TX=1
	-DCFG_TUD_AUDIO_FUNC_1_N_AS_INT=1
	-DCFG_TUD_AUDIO_FUNC_1_CTRL_BUF_SZ=64
	; Max ISO packet = 49 samples × 3 bytes (47/48/49 flow control).
	-DCFG_TUD_AUDIO_EP_SZ_IN=147
	-DCFG_TUD_AUDIO_FUNC_1_EP_IN_SZ_MAX=147
	-DCFG_TUD_AUDIO_FUNC_1_EP_IN_SW_BUF_SZ=588
	-DCFG_TUD_AUDIO_FUNC_1_DESC_LEN=132

; CMSIS-DSP (RP2350 / Cortex-M33 envs: pico2*, kiwi*). Vendored in
; third_party/CMSIS-DSP and compiled from source with the framework's own
; float ABI flags (Arduino-Pico RP2350 = softfp + fpv5-sp-d16; do NOT force hard,
; it will not link with the prebuilt framework libs). See third_party/CMSIS-DSP/README.md.
[rp2350_dsp]
lib_extra_dirs = third_party
lib_deps = CMSIS-DSP
build_flags =
	-DARM_MATH_CM33

[env:pico2]
platform = ${common.platform}
framework = ${common.framework}
board = rpipico2
board_build.core = ${common.board_build.core}
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${rp2350_dsp.lib_extra_dirs}
lib_deps = ${rp2350_dsp.lib_deps}
build_flags =
	${common.build_flags}
	${rp2350_dsp.build_flags}
	-DAUDIO_SOURCE=ADC
	-D_RP2350=1
	-DBOARD_PICO2=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0

[env:pico2_synthetic]
platform = ${common.platform}
framework = ${common.framework}
board = rpipico2
board_build.core = ${common.board_build.core}
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${rp2350_dsp.lib_extra_dirs}
lib_deps = ${rp2350_dsp.lib_deps}
build_flags =
	${common.build_flags}
	${rp2350_dsp.build_flags}
	-DAUDIO_SOURCE=SYNTHETIC
	-D_RP2350=1
	-DBOARD_PICO2=1
	-DADC_GPIO=26
	-DADC_CHANNEL=0

[env:kiwi]
platform = ${common.platform}
framework = ${common.framework}
board = generic_rp2350
board_build.core = ${common.board_build.core}
board_build.flash_size = 2MB
board_upload.maximum_size = 2097152
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
upload_protocol = picoprobe
debug_tool = picoprobe
lib_extra_dirs = ${rp2350_dsp.lib_extra_dirs}
lib_deps = ${rp2350_dsp.lib_deps}
build_flags =
	${common.build_flags}
	${rp2350_dsp.build_flags}
	-DAUDIO_SOURCE=ADC
	-D_RP2350=1
	-D__PICO_RP2350A=0
	-DBOARD_KIWI=1
	-DADC_GPIO=40
	-DADC_CHANNEL=0

[env:kiwi_synthetic]
platform = ${common.platform}
framework = ${common.framework}
board = generic_rp2350
board_build.core = ${common.board_build.core}
board_build.flash_size = 2MB
board_upload.maximum_size = 2097152
lib_archive = ${common.lib_archive}
monitor_speed = ${common.monitor_speed}
upload_protocol = picoprobe
debug_tool = picoprobe
lib_extra_dirs = ${rp2350_dsp.lib_extra_dirs}
lib_deps = ${rp2350_dsp.lib_deps}
build_flags =
	${common.build_flags}
	${rp2350_dsp.build_flags}
	-DAUDIO_SOURCE=SYNTHETIC
	-D_RP2350=1
	-D__PICO_RP2350A=0
	-DBOARD_KIWI=1
	-DADC_GPIO=40
	-DADC_CHANNEL=0

[env:pico2_pcm1808]
platform = ${common.platform}
framework = ${common.framework}
board = rpipico2
board_build.core = ${common.board_build.core}
lib_archive = ${common.lib_archive}
